<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>My persistent app</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background: Canvas;
        color: CanvasText;
      }
      /* Reserve the configured viewer corner even after the direct home link is hidden. */
      body[data-corner="top-left"],
      body[data-corner="top-right"] {
        padding-top: calc(80px + env(safe-area-inset-top));
      }
      body[data-corner="bottom-left"],
      body[data-corner="bottom-right"] {
        padding-bottom: calc(80px + env(safe-area-inset-bottom));
      }
      main {
        max-width: 42rem;
        margin: auto;
      }
      #note {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #jelly-home {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        min-height: 44px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        border: 1px solid GrayText;
        border-radius: 24px;
        background: Canvas;
        color: CanvasText;
        text-decoration: none;
      }
      #jelly-home[hidden] {
        display: none;
      }
      body[data-corner="top-right"] #jelly-home {
        left: auto;
        right: calc(12px + env(safe-area-inset-right));
      }
      body[data-corner="bottom-left"] #jelly-home,
      body[data-corner="bottom-right"] #jelly-home {
        top: auto;
        bottom: calc(12px + env(safe-area-inset-bottom));
      }
      body[data-corner="bottom-right"] #jelly-home {
        left: auto;
        right: calc(12px + env(safe-area-inset-right));
      }
      a:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body data-corner="top-left">
    <a id="jelly-home" aria-disabled="true">⌂ Jelly Apps</a>
    <main>
      <h1 id="title">My persistent app</h1>
      <p id="note"></p>
      <p id="status" role="status">Loading…</p>
    </main>
    <script type="module" src="/client.mjs"></script>
  </body>
</html>
